<!doctype html>
<html lang="es">
    <!-- Define el título, la descripción y las hojas de estilo de la página. -->
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="GameHub Store - Tienda Gamer" />
        <meta name="authors" content="Martin Naranjo, David Perez, Maximiliano Isamit" />
        <title>GameHub Store - Catalogo</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
        <link rel="stylesheet" href="css/styles.css" />
    </head>

    <!-- Agrupa todo el contenido visible de la página. -->
    <body data-vista="catalogo">
        <!-- Muestra la navegación compartida entre las vistas de la tienda. -->
        <header>
            <nav class="header-container" aria-label="Navegación principal">
                <!-- Permite volver al inicio al pulsar el logo. -->
                <div class="header-logo">
                    <a href="index.html">
                        <img src="assets/images/logo.png" alt="Logo GameHub Store" />
                    </a>
                </div>

                <!-- JavaScript completa el menú con las categorías compartidas. -->
                <div class="header-catalogo">
                    <button
                        class="btn btn-menu"
                        type="button"
                        id="dropdownCategorias"
                        data-bs-toggle="dropdown"
                        aria-expanded="false"
                    >
                        Categorías
                    </button>
                    <ul class="catalogo dropdown-menu" aria-labelledby="dropdownCategorias">
                        <li>
                            <a class="dropdown-item" href="catalogo.html">Todas las categorías</a>
                        </li>
                    </ul>
                </div>

                <!-- Envía el texto escrito al buscador del catálogo. -->
                <form class="d-flex" id="form-busqueda" role="search">
                    <input
                        class="form-control"
                        type="search"
                        id="input-busqueda"
                        placeholder="Buscar productos..."
                        aria-label="Buscar"
                    />
                    <button class="btn btn-outline-light" type="submit">Buscar</button>
                </form>

                <div class="header-ingreso">
                    <span class="modo-demo">Modo demostración</span>
                </div>

                <!-- Muestra los accesos al historial y al carrito de compra. -->
                <div class="header-acciones">
                    <a href="ordenes.html" class="link-cuenta">Mis Órdenes</a>
                    <a href="carrito.html" class="btn-carrito">Carrito (0)</a>
                </div>
            </nav>
        </header>
        <!-- Contiene la información principal de esta vista. -->
        <main>
            <h1 class="titulo-seccion mt-4">Catálogo de productos</h1>
            <div class="contenedor-pagina my-5">
                <div class="row">
                    <!-- Agrupa los filtros y el ordenamiento de los productos. -->
                    <aside class="col-12 col-lg-3">
                        <div class="card tarjeta-filtros p-4">
                            <h2 class="titulo-seccion">Filtros</h2>
                            <div id="contenedor-filtros">
                                <div class="mb-4">
                                    <h3 class="h6 fw-bold">Categoría</h3>
                                    <div id="filtros-categorias"></div>
                                </div>
                                <div class="mb-4">
                                    <h3 class="h6 fw-bold">Marca</h3>
                                    <div id="filtros-marcas"></div>
                                </div>
                                <div class="mb-4">
                                    <h3 class="h6 fw-bold">Rango de precio</h3>
                                    <div class="d-flex align-items-center gap-2">
                                        <input
                                            type="number"
                                            class="form-control form-control-sm"
                                            id="precio-min"
                                            placeholder="Mín"
                                            min="0"
                                            step="1"
                                            aria-label="Precio mínimo"
                                            aria-describedby="error-filtros"
                                        />
                                        <span aria-hidden="true">-</span>
                                        <input
                                            type="number"
                                            class="form-control form-control-sm"
                                            id="precio-max"
                                            placeholder="Máx"
                                            min="0"
                                            step="1"
                                            aria-label="Precio máximo"
                                            aria-describedby="error-filtros"
                                        />
                                    </div>
                                    <p
                                        id="error-filtros"
                                        class="text-danger small mt-2"
                                        role="alert"
                                    ></p>
                                    <button
                                        type="button"
                                        class="btn btn-agregar w-100 mt-3"
                                        id="btn-aplicar-filtros"
                                    >
                                        Aplicar filtros
                                    </button>
                                </div>
                            </div>
                            <hr class="my-4" />
                            <h2 class="titulo-seccion">Ordenar por</h2>
                            <select
                                class="form-select form-select-sm"
                                id="ordenar-productos"
                                aria-label="Ordenar productos"
                            >
                                <option value="relevancia" selected>Relevancia</option>
                                <option value="precio-asc">Precio: menor a mayor</option>
                                <option value="precio-desc">Precio: mayor a menor</option>
                                <option value="nombre-asc">Nombre: A - Z</option>
                                <option value="nombre-desc">Nombre: Z - A</option>
                            </select>
                        </div>
                    </aside>

                    <!-- JavaScript muestra los resultados y genera los botones de página. -->
                    <div class="col-12 col-lg-9">
                        <p id="resultado-catalogo" role="status"></p>
                        <div id="grilla-catalogo" class="row"></div>
                        <nav aria-label="Páginas del catálogo">
                            <ul
                                class="pagination justify-content-center mt-4"
                                id="paginacion-catalogo"
                            ></ul>
                        </nav>
                    </div>
                </div>
            </div>
        </main>

        <!-- Muestra la información general de la tienda al final de la página. -->
        <footer class="footer-principal">
            <p class="mb-0">&copy; 2026 GameHub Store. Todos los derechos reservados.</p>
            <p class="small mt-2 mb-0">
                Tienda de demostración académica. Los pagos son simulados.
            </p>
        </footer>

        <!-- Carga los controles de Bootstrap antes de iniciar la aplicación. -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
        <!-- Inicia los módulos compartidos y la vista indicada en esta página. -->
        <script type="module" src="js/app.js"></script>
    </body>
</html>
