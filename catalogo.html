<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="GameHub Store - Tienda Gamer">
        <meta name="authors" content="Martin Naranjo, David Perez, Maximiliano Isamit">
        <title>GameHub Store - Catalogo</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="css/styles.css">
    </head>
    <body>
        <header>
            <div class="header-container">

                <div class="header-logo">
                    <a href="index.html"><img src="assets/images/logo.png" alt="Logo GameHub Store"></a>
                </div>

                <div class="header-catalogo">
                    <button class="btn" type="button" id="dropdownCategorias" data-bs-toggle="dropdown" aria-expanded="false">
                        Categorías
                    </button>
                    <ul class="catalogo dropdown-menu" aria-labelledby="dropdownCategorias">
                        <li><a class="dropdown-item" href="catalogo.html">Todas las Categorías</a></li>
                        <li><a class="dropdown-item" href="catalogo.html?categoria=computadores">Computadores</a></li>
                        <li><a class="dropdown-item" href="catalogo.html?categoria=componentes">Componentes y Piezas</a></li>
                        <li><a class="dropdown-item" href="catalogo.html?categoria=perifericos">Periféricos</a></li>
                    </ul>
                </div>

                <div class="header-buscador">
                    <input type="text" placeholder="Busque productos, marcas y más...">
                    <button type="button">Buscar</button>
                </div>

                <div class="header-ingreso">
                    <button class="btn" type="button" id="dropdownMenuButton" data-bs-toggle="dropdown" aria-expanded="false">
                        Ingreso
                    </button>
                    <ul class="ingreso dropdown-menu">
                        <li><a class="dropdown-item" href="login.html">Ingresar</a></li>
                        <li><a class="dropdown-item" href="register.html">Registrarse</a></li>
                    </ul>
                </div>
                
                <div class="header-acciones">
                    <a href="ordenes.html" class="link-cuenta">Mis Órdenes</a>
                    <a href="carrito.html" class="btn-carrito"> Carrito (0)</a>
                </div>
            </div>
        </header>

        <main>
            <section class="container my-5">
                <div class="row">
                    <aside class="col-12 col-lg-3">
                        <div class="card tarjeta-filtros p-4">
                            <h4 class="titulo-seccion">Filtros</h4>

                            <div id="contenedor-filtros">
                                <div class="mb-4">
                                    <h6 class="fw-bold">Categoría</h6>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="computadores" id="cat-comp">
                                        <label class="form-check-label" for="cat-comp">Computadores</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="componentes" id="cat-comp-piezas">
                                        <label class="form-check-label" for="cat-comp-piezas">Componentes y Piezas</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="perifericos" id="cat-perif">
                                        <label class="form-check-label" for="cat-perif">Periféricos</label>
                                    </div>
                                </div>

                                <div class="mb-4">
                                    <h6 class="fw-bold">Marca</h6>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="lenovo" id="marca-lenovo">
                                        <label class="form-check-label" for="marca-lenovo">Lenovo</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="msi" id="marca-msi">
                                        <label class="form-check-label" for="marca-msi">MSI</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="samsung" id="marca-samsung">
                                        <label class="form-check-label" for="marca-samsung">Samsung</label>
                                    </div>
                                </div>
                                <div class="mb-4">
                                    <h6 class="fw-bold">Rango de Precio</h6>
                                    <div class="d-flex align-items-center gap-2">
                                        <input type="number" class="form-control form-control-sm" id="precio-min" placeholder="Mín">
                                        <span>-</span>
                                        <input type="number" class="form-control form-control-sm" id="precio-max" placeholder="Máx">
                                    </div>
                                    <button class="btn btn-agregar btn w-100 mt-3" id="btn-aplicar-filtros">Aplicar Filtros</button>
                                </div>
                            </div>

                            <hr class="my-4">

                            <h4 class="titulo-seccion">Ordenar por</h4>

                            <div id="contenedor-orden">
                                <select class="form-select form-select-sm" id="ordenar-productos">
                                <option value="relevancia" selected>Relevancia</option>
                                <option value="precio-asc">Precio: Menor a Mayor</option>
                                <option value="precio-desc">Precio: Mayor a Menor</option>
                                <option value="nombre-asc">Nombre: A - Z</option>
                                <option value="nombre-desc">Nombre: Z - A</option>
                            </select>
                            </div>
                        </div>
                    </aside>
                     
                    <div class="col-12 col-lg-9">
                        <div id="grill-catalogo" class="row"></div>

                        <nav aria-label="Navegacion del Catalogo">
                            <ul class="pagination justify-content-center" id="paginacion-catalogo">

                            </ul>
                        </nav>
                    </div>
                </div>
            </section>

        </main>
        
        <footer class="footer-principal">
            <div class="container text-center">
                <p class="mb-0 fw-bold">&copy; 2026 GameHub Store. Todos los derechos reservados.</p>
                <p class="small mt-2">Desarrollo FullStack II - Evaluación Parcial 1</p>
            </div>
        </footer>

        <script src="js/script.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
