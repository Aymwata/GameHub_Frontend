<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="GameHub Store - Carrito">
        <title>GameHub Store - Carrito</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
        <link rel="stylesheet" href="css/styles.css">
    </head>
    <body class="bg-light">
        <header>
            <div class="header-container" style="background-color: var(--color-primario);">
                <div class="header-logo">
                    <a href="index.html"><img src="assets/images/logo.png" alt="Logo GameHub Store" style="max-height: 40px;"></a>
                </div>

                <div class="header-catalogo">
                    <button class="btn" type="button" id="dropdownCategorias" data-bs-toggle="dropdown" aria-expanded="false">
                        Categorias
                    </button>
                    <ul class="catalogo dropdown-menu" aria-labelledby="dropdownCategorias">
                        <li><a class="dropdown-item" href="catalogo.html">Todas las Categorias</a></li>
                        <li><a class="dropdown-item" href="catalogo.html?categoria=tarjetas-graficas">Componentes</a></li>
                        <li><a class="dropdown-item" href="catalogo.html?categoria=perifericos">Perifericos</a></li>
                        <li><a class="dropdown-item" href="catalogo.html?categoria=notebooks">Notebooks</a></li>
                    </ul>
                </div>

                <div class="header-buscador">
                    <input type="text" placeholder="Busque productos, marcas y mas...">
                    <button type="button">Buscar</button>
                </div>

                <div class="header-ingreso">
                    <button class="btn" type="button" id="dropdownMenuButton" data-bs-toggle="dropdown" aria-expanded="false">
                        Ingreso
                    </button>
                    <ul class="ingreso dropdown-menu">
                        <li><a class="dropdown-item" href="login.html">Ingresar</a></li>
                        <li><a class="dropdown-item" href="register.html">Registrarse</a></li>
                    </ul>
                </div>
                
                <div class="header-acciones">
                    <a href="ordenes.html" class="link-cuenta">Mis Ordenes</a>
                    <a href="carrito.html" class="btn-carrito"> Carrito</a>
                </div>
            </div>
        </header>

        <main class="container my-5 pt-5">
            <h2 class="mb-4 fw-bold" style="color: var(--color-primario);">Carrito de Compras</h2>
            <div class="row" id="contenedor-carrito">
            </div>
        </main>

        <footer class="footer-principal mt-5" style="background-color: var(--color-primario); color: white; padding: 25px 20px; text-align: center;">
            <div class="container">
                <p class="mb-0 fw-bold">&copy; 2026 GameHub Store. Todos los derechos reservados.</p>
                <p class="small mt-2"></p>
            </div>
        </footer>

        <script src="js/carrito.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    </body>
</html>
