<!doctype html>
<html lang="es">
    <!-- Configura el título y los estilos utilizados en esta página. -->
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="GameHub Store - Carrito" />
        <title>GameHub Store - Carrito</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
        <link rel="stylesheet" href="css/styles.css" />
    </head>
    <body data-vista="carrito">
        <!-- Muestra el menú compartido y los accesos a las otras vistas. -->
        <header>
            <nav class="header-container" aria-label="Navegación principal">
                <!-- Permite volver al inicio al pulsar el logo. -->
                <div class="header-logo">
                    <a href="index.html">
                        <img src="assets/images/logo.png" alt="Logo GameHub Store" />
                    </a>
                </div>

                <!-- JavaScript completa el menú con las categorías compartidas. -->
                <div class="header-catalogo">
                    <button
                        class="btn btn-menu"
                        type="button"
                        id="dropdownCategorias"
                        data-bs-toggle="dropdown"
                        aria-expanded="false"
                    >
                        Categorías
                    </button>
                    <ul class="catalogo dropdown-menu" aria-labelledby="dropdownCategorias">
                        <li>
                            <a class="dropdown-item" href="catalogo.html">Todas las categorías</a>
                        </li>
                    </ul>
                </div>

                <!-- Envía el texto escrito al buscador del catálogo. -->
                <form class="d-flex" id="form-busqueda" role="search">
                    <input
                        class="form-control"
                        type="search"
                        id="input-busqueda"
                        placeholder="Buscar productos..."
                        aria-label="Buscar"
                    />
                    <button class="btn btn-outline-light" type="submit">Buscar</button>
                </form>

                <div class="header-ingreso">
                    <span class="modo-demo">Modo demostración</span>
                </div>

                <!-- Muestra los accesos al historial y al carrito de compra. -->
                <div class="header-acciones">
                    <a href="ordenes.html" class="link-cuenta">Mis Órdenes</a>
                    <a href="carrito.html" class="btn-carrito">Carrito (0)</a>
                </div>
            </nav>
        </header>

        <!-- Contiene la información y los controles principales de esta vista. -->
        <main class="contenedor-pagina my-5 pt-5">
            <h1 class="titulo-seccion">Carrito de compras</h1>
            <div class="row" id="contenedor-carrito"></div>
        </main>

        <!-- Muestra la información general de la tienda al final de la página. -->
        <footer class="footer-principal">
            <p class="mb-0">&copy; 2026 GameHub Store. Todos los derechos reservados.</p>
            <p class="small mt-2 mb-0">
                Tienda de demostración académica. Los pagos son simulados.
            </p>
        </footer>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
        <!-- Inicia los módulos compartidos y la vista indicada en esta página. -->
        <script type="module" src="js/app.js"></script>
        <!-- Carga los controles de Bootstrap antes de iniciar la aplicación. -->
    </body>
</html>
