<!DOCTYPE html>
<html lang="es">
    <!-- Configura el título y los estilos utilizados en esta página. -->
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>GameHub - Mis Órdenes</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
        <link rel="stylesheet" href="css/styles.css">
    </head>
    <body> 
        <!-- Muestra el menú compartido y los accesos a las otras vistas. -->
        <header>

            <nav class="header-container" aria-label="Navegación principal">

                <!-- Permite volver al inicio al pulsar el logo. -->
                <div class="header-logo">
                    <a href="index.html"><img src="assets/images/logo.png" alt="Logo GameHub Store"></a>
                </div>

                <!-- Ofrece accesos al catálogo completo y a sus categorías. -->
                <div class="header-catalogo">
                    <button class="btn" type="button" id="dropdownCategorias" data-bs-toggle="dropdown" aria-expanded="false">
                        Categorías
                    </button>
                    <ul class="catalogo dropdown-menu" aria-labelledby="dropdownCategorias">
                        <li><a class="dropdown-item" href="catalogo.html">Todas las Categorías</a></li>
                        <li><a class="dropdown-item" href="catalogo.html?categoria=computadores">Computadores</a></li>
                        <li><a class="dropdown-item" href="catalogo.html?categoria=componentes">Componentes y Piezas</a></li>
                        <li><a class="dropdown-item" href="catalogo.html?categoria=perifericos">Periféricos</a></li>
                    </ul>
                </div>

                <!-- Recoge el texto que se buscará en el catálogo. -->
                <form class="d-flex" id="form-busqueda" role="search">
                    <input class="form-control" type="search" id="input-busqueda" placeholder="Buscar productos..." aria-label="Buscar">
                    <button class="btn btn-outline-light" type="submit">Buscar</button>
                </form>
                <div class="header-ingreso"><span class="modo-demo">Modo demostración</span></div>
                
                <!-- Permite abrir el historial de órdenes y el carrito. -->
                <div class="header-acciones">
                    <a href="ordenes.html" class="link-cuenta">Mis Órdenes</a>
                    <a href="carrito.html" class="btn-carrito"> Carrito (0)</a>
                </div>
            </nav>
        </header>

        <!-- Contiene la información y los controles principales de esta vista. -->
        <main class="container">
            <h1 class="titulo-seccion">Historial de compras</h1>

            <div id="grilla-ordenes" class="grilla-ordenes"></div>
        </main>
        <!-- Muestra la información general de la tienda al final de la página. -->
        <footer class="footer-principal">
            <p class="mb-0">&copy; 2026 GameHub Store. Todos los derechos reservados.</p>
            <p class="small mt-2 mb-0">Tienda de demostración académica. Los pagos son simulados.</p>
        </footer>
    <script src="js/datos.js"></script>
        <script src="js/tienda.js"></script>
        <script src="js/script.js"></script>


         <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
         
    
    </body>
</html>
