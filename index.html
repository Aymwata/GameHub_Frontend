<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="GameHub Store - Tienda Gamer">
        <meta name="authors" content="Martin Naranjo, David Perez, Maximiliano Isamit">
        <title>GameHub Store - Inicio</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="css/styles.css">
    </head>
    <body>
        <header>
            <div class="header-container">
                <div class="header-logo">
                    <a href="index.html"><img src="assets/images/logo.png" alt="Logo GameHub Store"></a>
                </div>

                <div class="header-catalogo">
                    <button class="btn" type="button" id="dropdownCategorias" data-bs-toggle="dropdown" aria-expanded="false">
                        Categorías
                    </button>
                    <ul class="catalogo dropdown-menu" aria-labelledby="dropdownCategorias">
                        <li><a class="dropdown-item" href="catalogo.html">Todas las Categorías</a></li>
                        <li><a class="dropdown-item" href="catalogo.html?categoria=tarjetas-graficas">Componentes</a></li>
                        <li><a class="dropdown-item" href="catalogo.html?categoria=perifericos">Periféricos</a></li>
                        <li><a class="dropdown-item" href="catalogo.html?categoria=notebooks">Notebooks</a></li>
                    </ul>
                </div>

                <div class="header-buscador">
                    <input type="text" placeholder="¿Qué buscas hoy? (Ej: Tarjeta Gráfica)">
                    <button type="button">Buscar</button>
                </div>

                <div class="header-ingreso">
                    <button class="btn" type="button" id="dropdownMenuButton" data-bs-toggle="dropdown" aria-expanded="false">
                        Ingresar / Registrarse
                    </button>
                    <ul class="ingreso dropdown-menu">
                        <li><a class="dropdown-item" href="login.html">Ingresar</a></li>
                        <li><a class="dropdown-item" href="register.html">Registrarse</a></li>
                    </ul>
                </div>
                
                <div class="header-acciones">
                    <a href="ordenes.html" class="link-cuenta">Mis Órdenes</a>
                    <a href="carrito.html" class="btn-carrito">🛒 Carrito (0)</a>
                </div>
            </div>
        </header>



        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
